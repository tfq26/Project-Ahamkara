<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahamkara — Game Engine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Skip link: lets keyboard and screen-reader users jump straight to the
       main content instead of tabbing through every element above it. -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- Primary landing page content -->
  <main id="main-content">
    <h1>Ahamkara</h1>
    <p>A custom C++20 game engine and multiplayer tech demo built from scratch.</p>
    <p>
      Dedicated authoritative server with client networking skeleton —
      UDP transport at ~60 Hz, GLFW3 debug renderer, CMake + Ninja build.
    </p>
    <!-- Navigation: native anchor links are keyboard-focusable and announced
         by assistive technology. -->
    <nav class="links" aria-label="Primary navigation">
      <a href="https://git.2helix.org/taufeeq26/Project-Ahamkara">Source</a>
    </nav>
  </main>
  <script>
    (function () {
      var r = sessionStorage.getItem('_spa_redirect');
      if (r) {
        sessionStorage.removeItem('_spa_redirect');
        var u = new URL(r);
        var h = u.hash;
        var p = u.pathname + u.search + (h || '');
        if (p !== '/' && p !== '') {
          history.replaceState(null, '', p);
        }
      }
    })();
  </script>
</body>
</html>
