<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahamkara — Game Engine</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #c9d1d9;
    }
    main {
      max-width: 640px;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 0.5rem;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      line-height: 1.6;
      color: #8b949e;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .links {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ahamkara</h1>
    <p>A custom C++20 game engine and multiplayer tech demo built from scratch.</p>
    <p>
      Dedicated authoritative server with client networking skeleton —
      UDP transport at ~60 Hz, GLFW3 debug renderer, CMake + Ninja build.
    </p>
    <div class="links">
      <a href="https://git.2helix.org/taufeeq26/Project-Ahamkara">Source</a>
    </div>
  </main>
  <script>
    (function () {
      var r = sessionStorage.getItem('_spa_redirect');
      if (r) {
        sessionStorage.removeItem('_spa_redirect');
        var u = new URL(r);
        var h = u.hash;
        var p = u.pathname + u.search + (h || '');
        if (p !== '/' && p !== '') {
          history.replaceState(null, '', p);
        }
      }
    })();
  </script>
</body>
</html>
