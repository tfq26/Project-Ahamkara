<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#357abd"/>
    </linearGradient>
    <linearGradient id="ci" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <linearGradient id="artifact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <linearGradient id="prod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e44ad"/>
      <stop offset="100%" stop-color="#6c3483"/>
    </linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d68910"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="750" height="520" fill="url(#bg)" rx="8"/>

  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Ahamkara — Deployment Model</text>

  <!-- Row 1: Development -->
  <rect x="40" y="50" width="670" height="95" rx="8" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.4"/>
  <text x="375" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#4a90d9">DEVELOPMENT</text>

  <rect x="60" y="85" width="180" height="45" rx="6" fill="url(#dev)" filter="url(#shadow)"/>
  <text x="150" y="107" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">💻 Developer Workstation</text>
  <text x="150" y="122" text-anchor="middle" font-size="8" fill="#d6eaf8">Clone · Branch · Code</text>

  <rect x="280" y="85" width="180" height="45" rx="6" fill="url(#dev)" filter="url(#shadow)"/>
  <text x="370" y="107" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">🔨 Local Build</text>
  <text x="370" y="122" text-anchor="middle" font-size="8" fill="#d6eaf8">cmake --preset debug</text>

  <rect x="500" y="85" width="180" height="45" rx="6" fill="url(#dev)" filter="url(#shadow)"/>
  <text x="590" y="107" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">🧪 Local Test</text>
  <text x="590" y="122" text-anchor="middle" font-size="8" fill="#d6eaf8">ctest --output-on-failure</text>

  <line x1="240" y1="107" x2="280" y2="107" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="107" x2="500" y2="107" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Down arrow -->
  <line x1="150" y1="130" x2="150" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="130" x2="370" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="130" x2="590" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: Git Push -->
  <rect x="40" y="163" width="670" height="75" rx="8" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.4"/>
  <text x="375" y="181" text-anchor="middle" font-size="11" font-weight="600" fill="#e67e22">VERSION CONTROL</text>

  <rect x="60" y="195" width="170" height="30" rx="15" fill="url(#ci)" filter="url(#shadow)"/>
  <text x="145" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">git push origin HEAD</text>

  <rect x="280" y="195" width="200" height="30" rx="15" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="380" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#ecf0f1">🌐 Git.2helix.org (Forgejo)</text>

  <rect x="530" y="195" width="160" height="30" rx="15" fill="url(#ci)" filter="url(#shadow)"/>
  <text x="610" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Pull Request (Draft)</text>

  <line x1="230" y1="210" x2="280" y2="210" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="210" x2="530" y2="210" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Down arrow -->
  <line x1="145" y1="225" x2="145" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="225" x2="380" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="225" x2="610" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 3: CI Pipeline -->
  <rect x="40" y="253" width="670" height="110" rx="8" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.4"/>
  <text x="375" y="271" text-anchor="middle" font-size="11" font-weight="600" fill="#27ae60">CONTINUOUS INTEGRATION (GitHub Actions)</text>

  <rect x="50" y="285" width="125" height="60" rx="6" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="112" y="308" text-anchor="middle" font-size="9" font-weight="600" fill="#ecf0f1">1. Lint</text>
  <text x="112" y="324" text-anchor="middle" font-size="8" fill="#95a5a6">clang-tidy</text>
  <text x="112" y="337" text-anchor="middle" font-size="8" fill="#95a5a6">clang-format</text>

  <rect x="195" y="285" width="125" height="60" rx="6" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="257" y="308" text-anchor="middle" font-size="9" font-weight="600" fill="#ecf0f1">2. Build</text>
  <text x="257" y="324" text-anchor="middle" font-size="8" fill="#95a5a6">debug / release</text>
  <text x="257" y="337" text-anchor="middle" font-size="8" fill="#95a5a6">debug-headless</text>

  <rect x="340" y="285" width="125" height="60" rx="6" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="402" y="308" text-anchor="middle" font-size="9" font-weight="600" fill="#ecf0f1">3. Test</text>
  <text x="402" y="324" text-anchor="middle" font-size="8" fill="#95a5a6">48+ CTest targets</text>
  <text x="402" y="337" text-anchor="middle" font-size="8" fill="#95a5a6">Unit + integration</text>

  <rect x="485" y="285" width="100" height="60" rx="6" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="535" y="308" text-anchor="middle" font-size="9" font-weight="600" fill="#ecf0f1">4. Package</text>
  <text x="535" y="324" text-anchor="middle" font-size="8" fill="#95a5a6">CPack TGZ</text>
  <text x="535" y="337" text-anchor="middle" font-size="8" fill="#95a5a6">Out-of-tree test</text>

  <rect x="605" y="285" width="90" height="60" rx="6" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="650" y="308" text-anchor="middle" font-size="9" font-weight="600" fill="#ecf0f1">5. Bench</text>
  <text x="650" y="324" text-anchor="middle" font-size="8" fill="#95a5a6">Headless</text>
  <text x="650" y="337" text-anchor="middle" font-size="8" fill="#95a5a6">perf metrics</text>

  <line x1="175" y1="315" x2="195" y2="315" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="315" x2="340" y2="315" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="465" y1="315" x2="485" y2="315" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="315" x2="605" y2="315" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Down arrow -->
  <line x1="375" y1="363" x2="375" y2="385" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 4: Artifacts -->
  <rect x="40" y="388" width="670" height="55" rx="8" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.4"/>
  <text x="375" y="406" text-anchor="middle" font-size="11" font-weight="600" fill="#8e44ad">ARTIFACTS</text>

  <rect x="50" y="415" width="150" height="20" rx="4" fill="url(#artifact)" filter="url(#shadow)"/>
  <text x="125" y="430" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">📦 Native executables</text>

  <rect x="230" y="415" width="140" height="20" rx="4" fill="url(#artifact)" filter="url(#shadow)"/>
  <text x="300" y="430" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">📦 CPack packages</text>

  <rect x="400" y="415" width="130" height="20" rx="4" fill="url(#artifact)" filter="url(#shadow)"/>
  <text x="465" y="430" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">🐳 Docker image</text>

  <rect x="560" y="415" width="130" height="20" rx="4" fill="url(#artifact)" filter="url(#shadow)"/>
  <text x="625" y="430" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">📋 Lint reports</text>

  <!-- Down arrow -->
  <line x1="375" y1="443" x2="375" y2="458" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 5: Deployment targets -->
  <rect x="40" y="461" width="670" height="50" rx="8" fill="none" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.4"/>
  <text x="375" y="478" text-anchor="middle" font-size="11" font-weight="600" fill="#f39c12">DEPLOYMENT TARGETS</text>

  <rect x="50" y="485" width="200" height="20" rx="4" fill="url(#target)" filter="url(#shadow)"/>
  <text x="150" y="499" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">🖥️ Self-hosted Linux server</text>

  <rect x="280" y="485" width="200" height="20" rx="4" fill="url(#target)" filter="url(#shadow)"/>
  <text x="380" y="499" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">🖥️ Dedicated game server</text>

  <rect x="510" y="485" width="180" height="20" rx="4" fill="url(#target)" filter="url(#shadow)"/>
  <text x="600" y="499" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">💻 Developer machines</text>
</svg>