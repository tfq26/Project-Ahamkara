services:
  wish-engine:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      WISH_SERVER_PORT: ${WISH_SERVER_PORT:-7777}
      WISH_SERVER_ADMIN_PORT: ${WISH_SERVER_ADMIN_PORT:-7778}
      WISH_SERVER_TICK_RATE: ${WISH_SERVER_TICK_RATE:-60}
      WISH_SERVER_MAX_PLAYERS: ${WISH_SERVER_MAX_PLAYERS:-8}
      WISH_SERVER_DISCONNECT_TIMEOUT_SEC: ${WISH_SERVER_DISCONNECT_TIMEOUT_SEC:-10}
      WISH_SERVER_MATCH_DURATION_SEC: ${WISH_SERVER_MATCH_DURATION_SEC:-600}
    ports:
      - "${WISH_SERVER_PORT:-7777}:7777/udp"
      - "${WISH_SERVER_ADMIN_PORT:-7778}:7778/tcp"
