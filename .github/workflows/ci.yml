# CI workflow
#
# Builds all CMake presets (debug, release, debug-headless) and runs tests
# for presets that support them. Runs Valgrind memcheck on the headless
# test targets to detect memory leaks and invalid accesses. The Valgrind
# job is currently non-blocking (continue-on-error: true) and should be
# made required once all known leaks are fixed.
# Runs on self-hosted Linux runner (servlenovo1).
# Agent branches auto-merge only when they explicitly opt in through the
# agent/automerge/** namespace; ordinary agent branches are PR-only.

name: CI

on:
  push:
    branches:
      - main
      - develop
      - "agent/automerge/**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  issues: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate compilation database
        run: cmake --preset debug

      - name: Run change-aware lint gate
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_ref="${EVENT_BASE_REF}"
          if [[ -z "${base_ref}" || "${base_ref}" =~ ^0+$ ]]; then
            base_ref=$(git rev-parse HEAD^)
          fi
          ./scripts/lint.sh \
            --base-ref "${base_ref}" \
            --committed-only \
            --compile-db build/debug

      - name: Publish lint summary
        if: always()
        run: |
          if [[ -f build/lint/summary.md ]]; then
            cat build/lint/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-lint-report
          path: build/lint/
          if-no-files-found: warn

  build-and-test:
    name: ${{ matrix.preset }} (self-hosted)
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, debug-headless]

    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests (debug only)
        if: matrix.preset == 'debug'
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Run tests (debug-headless only)
        if: matrix.preset == 'debug-headless'
        run: ctest --test-dir build/debug-headless --output-on-failure

  valgrind:
    name: Valgrind memcheck
    runs-on: [self-hosted, linux]
    needs: lint
    # Initially non-blocking — allows CI to pass while leaks are fixed.
    # Remove continue-on-error once all known leaks are resolved.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Valgrind
        run: |
          if command -v apt-get &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq valgrind
          elif command -v dnf &>/dev/null; then
            sudo dnf install -y valgrind
          else
            echo "WARNING: no package manager found — assuming valgrind is pre-installed"
          fi
          valgrind --version

      - name: Run tests under Valgrind
        id: valgrind_run
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          ./scripts/valgrind-tests.sh --preset debug-headless --build 2>&1 | tee build/valgrind-run.log

      - name: Summarize Valgrind results
        if: always()
        run: |
          {
            echo "## Valgrind Memcheck Results" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            if grep -q "❌ FAIL" build/valgrind-run.log 2>/dev/null; then
              echo "**FAILED** — memory issues detected" >> "${GITHUB_STEP_SUMMARY}"
              grep -B2 "❌ FAIL" build/valgrind-run.log >> "${GITHUB_STEP_SUMMARY}" || true
            else
              if grep -q "✅ PASS" build/valgrind-run.log 2>/dev/null; then
                PASS=$(grep -c "✅ PASS" build/valgrind-run.log)
                echo "**PASSED** — ${PASS} tests clean" >> "${GITHUB_STEP_SUMMARY}"
              fi
            fi
            # Append the Valgrind test summary
            sed -n '/Valgrind Test Summary/,/^$/p' build/valgrind-run.log >> "${GITHUB_STEP_SUMMARY}" || true
          } || true

      - name: Upload Valgrind logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-valgrind-logs
          path: build/debug-headless/valgrind-*.log
          if-no-files-found: warn

  package:
    name: Package
    runs-on: [self-hosted, linux]
    needs: [build-and-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package
        run: |
          cmake --preset package
          cmake --build --preset package
          cpack --preset package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-package
          path: build/package/*.tar.gz

  auto-merge:
    needs: build-and-test
    if: |
      success() &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'agent/automerge/')
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-merge into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Oz Agent"
          git config user.email "oz-agent@warp.dev"
          git fetch origin develop
          git checkout develop
          if git merge --no-ff "${{ github.ref_name }}" -m "Auto-merge ${{ github.ref_name }} into develop [skip ci]"; then
            git push origin develop
            echo "Merged ${{ github.ref_name }} into develop"
            # Post success comment on the triggering issue if applicable
            BRANCH="${{ github.ref_name }}"
            ISSUE_NUM=$(echo "$BRANCH" | grep -oE '[0-9]+' | head -1)
            if [ -n "$ISSUE_NUM" ]; then
              gh issue comment "$ISSUE_NUM" --body "✅ Auto-merged into \`develop\`. Next stop: \`main\` via release PR." 2>/dev/null || true
            fi
          else
            echo "Merge conflict — manual intervention needed"
            exit 1
          fi
