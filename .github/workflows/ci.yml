# CI workflow
#
# Builds all CMake presets (debug, release) and runs tests, package, and
# engine-only validation. Runs on self-hosted Linux runner (servlenovo1).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for unresolved template tokens
        run: ./scripts/check-template-tokens.sh --ci

      - name: Check for tracked __pycache__ directories
        run: |
          PYCACHE=$(git ls-files '**/__pycache__/')
          if [[ -n "$PYCACHE" ]]; then
            echo "Error: tracked __pycache__ directories found:"
            echo "$PYCACHE"
            exit 1
          fi
          echo "No tracked __pycache__ directories — clean"

  build-and-test:
    name: ${{ matrix.preset }} (self-hosted)
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, debug-headless]

    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests (debug only)
        if: matrix.preset == 'debug'
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Run tests (debug-headless only)
        if: matrix.preset == 'debug-headless'
        run: ctest --test-dir build/debug-headless --output-on-failure

  engine-only:
    name: Engine-only
    needs: validate
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (engine-only)
        run: cmake --preset debug -DAHAMKARA_ENGINE_ONLY=ON

      - name: Build (engine-only)
        run: cmake --build --preset debug

      - name: Run engine tests
        run: ctest --test-dir build/debug --output-on-failure

  package:
    name: Package
    runs-on: [self-hosted, linux]
    needs: [build-and-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package
        run: |
          cmake --preset package
          cmake --build --preset package
          cpack --preset package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-package
          path: build/package/*.tar.gz
