# CI workflow
#
# Builds all CMake presets (debug, release, debug-headless) and runs tests
# for presets that support them.  Runs on Ubuntu 24.04 and macOS 14.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-and-test:
    name: ${{ matrix.preset }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, debug-headless]
        os: [ubuntu-24.04, macos-14]
        exclude:
          # macOS jobs: only debug and release (no headless runner needed)
          - os: macos-14
            preset: debug-headless

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libglfw3-dev libgl1-mesa-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja glfw

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests (debug only)
        if: matrix.preset == 'debug'
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Run tests (debug-headless only)
        if: matrix.preset == 'debug-headless'
        run: ctest --test-dir build/debug-headless --output-on-failure

  package:
    name: Package
    runs-on: ubuntu-24.04
    needs: [build-and-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libglfw3-dev libgl1-mesa-dev

      - name: Package
        run: |
          cmake --preset package
          cmake --build --preset package
          cpack --preset package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-package
          path: build/package/*.tar.gz
