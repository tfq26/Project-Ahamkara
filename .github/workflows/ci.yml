# CI workflow
#
# Builds all CMake presets (debug, release, debug-headless) and runs tests
# for presets that support them. Runs on self-hosted Linux runner (servlenovo1).
# Agent branches auto-merge only when they explicitly opt in through the
# agent/automerge/** namespace; ordinary agent branches are PR-only.
#
# ═══════════════════════════════════════════════════════════════════════════
# MAIN BRANCH PROTECTION
#
# The `main` branch is protected by a GitHub ruleset ("Main Protection") AND
# legacy branch-protection rules.  Together they enforce:
#
#   - All merges MUST go through a pull request.
#   - Every PR MUST have 1+ approving review AND pass every required status
#     check (Lint, debug, release, debug-headless, Package).
#   - Branches MUST be up-to-date with `main` before merging
#     (strict_required_status_checks_policy).
#   - Force pushes and branch deletions are blocked at the API level.
#   - Bypass actors are empty — even administrators cannot skip these rules.
#
# These file-level checks are SECONDARY; the primary gate is the ruleset.
# Do not rely solely on `[skip ci]` to bypass — the ruleset enforces checks
# regardless of workflow-level skip optimisations.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches:
      - main
      - develop
      - "agent/automerge/**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  issues: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # ── Guard: reject [skip ci] on main pushes ──────────────────────────
  # This is a safety net. Even if someone bypasses the PR-only rule and
  # pushes directly to main with [skip ci], this job runs first and fails,
  # preventing the required status checks from being satisfied.
  guard-main-no-skip:
    name: Guard main
    runs-on: [self-hosted, linux]
    if: github.ref_name == 'main'
    steps:
      - name: Block [skip ci] on main
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
        run: |
          if echo "$COMMIT_MSG" | grep -qi '\[skip ci\]'; then
            echo "::error::Commit to main contains '[skip ci]' which would bypass"
            echo "::error::required status checks.  Remove [skip ci] and re-push."
            exit 1
          fi
          echo "✅ No skip-ci marker found."

  lint:
    name: Lint
    needs: [guard-main-no-skip]
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate compilation database
        run: cmake --preset debug

      - name: Run change-aware lint gate
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_ref="${EVENT_BASE_REF}"
          if [[ -z "${base_ref}" || "${base_ref}" =~ ^0+$ ]]; then
            base_ref=$(git rev-parse HEAD^)
          fi
          ./scripts/lint.sh \
            --base-ref "${base_ref}" \
            --committed-only \
            --compile-db build/debug

      - name: Publish lint summary
        if: always()
        run: |
          if [[ -f build/lint/summary.md ]]; then
            cat build/lint/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-lint-report
          path: build/lint/
          if-no-files-found: warn

  build-and-test:
    name: ${{ matrix.preset }} (self-hosted)
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, debug-headless]

    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests (debug only)
        if: matrix.preset == 'debug'
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Run tests (debug-headless only)
        if: matrix.preset == 'debug-headless'
        run: ctest --test-dir build/debug-headless --output-on-failure

  package:
    name: Package
    runs-on: [self-hosted, linux]
    needs: [build-and-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package
        run: |
          cmake --preset package
          cmake --build --preset package
          cpack --preset package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-package
          path: build/package/*.tar.gz

  auto-merge:
    needs: build-and-test
    if: |
      success() &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'agent/automerge/')
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-merge into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Oz Agent"
          git config user.email "oz-agent@warp.dev"
          git fetch origin develop
          git checkout develop
          if git merge --no-ff "${{ github.ref_name }}" -m "Auto-merge ${{ github.ref_name }} into develop [skip ci]"; then
            git push origin develop
            echo "Merged ${{ github.ref_name }} into develop"
            # Post success comment on the triggering issue if applicable
            BRANCH="${{ github.ref_name }}"
            ISSUE_NUM=$(echo "$BRANCH" | grep -oE '[0-9]+' | head -1)
            if [ -n "$ISSUE_NUM" ]; then
              gh issue comment "$ISSUE_NUM" --body "✅ Auto-merged into \`develop\`. Next stop: \`main\` via release PR." 2>/dev/null || true
            fi
          else
            echo "Merge conflict — manual intervention needed"
            exit 1
          fi
