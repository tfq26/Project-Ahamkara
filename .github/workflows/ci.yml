# CI workflow
#
# Builds all CMake presets (debug, release, debug-headless) and runs tests
# for presets that support them. Runs on self-hosted Linux runner (servlenovo1)
# for Linux builds and on GitHub-hosted windows-latest for MSVC builds.
# Agent branches auto-merge only when they explicitly opt in through the
# agent/automerge/** namespace; ordinary agent branches are PR-only.

name: CI

on:
  push:
    branches:
      - main
      - develop
      - "agent/automerge/**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  issues: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate compilation database
        run: cmake --preset debug

      - name: Run change-aware lint gate
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_ref="${EVENT_BASE_REF}"
          if [[ -z "${base_ref}" || "${base_ref}" =~ ^0+$ ]]; then
            base_ref=$(git rev-parse HEAD^)
          fi
          ./scripts/lint.sh \
            --base-ref "${base_ref}" \
            --committed-only \
            --compile-db build/debug

      - name: Publish lint summary
        if: always()
        run: |
          if [[ -f build/lint/summary.md ]]; then
            cat build/lint/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-lint-report
          path: build/lint/
          if-no-files-found: warn

  build-and-test:
    name: ${{ matrix.preset }} (self-hosted)
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, debug-headless]

    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests (debug only)
        if: matrix.preset == 'debug'
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Run tests (debug-headless only)
        if: matrix.preset == 'debug-headless'
        run: ctest --test-dir build/debug-headless --output-on-failure

  package:
    name: Package
    runs-on: [self-hosted, linux]
    needs: [build-and-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package
        run: |
          cmake --preset package
          cmake --build --preset package
          cpack --preset package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-package
          path: build/package/*.tar.gz

  windows:
    name: Windows MSVC
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja --no-progress --limit-output

      - name: Install GLFW3 via vcpkg
        run: |
          vcpkg install glfw3 --triplet x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure headless
        run: |
          cmake --preset debug-headless `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build headless
        run: cmake --build --preset debug-headless

      - name: Run headless tests
        run: ctest --test-dir build/debug-headless --output-on-failure

      - name: Configure debug
        run: |
          cmake --preset debug `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build debug
        run: cmake --build --preset debug

      - name: Run debug tests
        run: ctest --test-dir build/debug --output-on-failure -C Debug

      - name: Configure release
        run: |
          cmake --preset release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build release
        run: cmake --build --preset release

      - name: Configure package
        run: |
          cmake --preset package `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build package
        run: cmake --build --preset package

      - name: CPack
        run: cpack --preset package

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-package-windows
          path: build/package/*.zip
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahamkara-build-logs-windows
          path: |
            build/**/CMakeFiles/*.log
            build/**/CMakeError.log
            build/**/CMakeOutput.log
          if-no-files-found: warn

  auto-merge:
    needs: build-and-test
    if: |
      success() &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'agent/automerge/')
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-merge into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Oz Agent"
          git config user.email "oz-agent@warp.dev"
          git fetch origin develop
          git checkout develop
          if git merge --no-ff "${{ github.ref_name }}" -m "Auto-merge ${{ github.ref_name }} into develop [skip ci]"; then
            git push origin develop
            echo "Merged ${{ github.ref_name }} into develop"
            # Post success comment on the triggering issue if applicable
            BRANCH="${{ github.ref_name }}"
            ISSUE_NUM=$(echo "$BRANCH" | grep -oE '[0-9]+' | head -1)
            if [ -n "$ISSUE_NUM" ]; then
              gh issue comment "$ISSUE_NUM" --body "✅ Auto-merged into \`develop\`. Next stop: \`main\` via release PR." 2>/dev/null || true
            fi
          else
            echo "Merge conflict — manual intervention needed"
            exit 1
          fi
