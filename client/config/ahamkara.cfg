# Ahamkara client configuration.
# Lines starting with '#' are comments.
# Blank lines are ignored.
#
# Format: key = value
# Every key is optional — if missing the default shown below is used.

# Display
window_width     = 1280
window_height    = 720
fullscreen       = false

# Input
mouse_sensitivity = 1.0

# Network
server_ip = 127.0.0.1

# Audio
# audio_enabled       = true
# audio_master_volume = 1.0
# audio_sfx_volume    = 1.0
# audio_weapon_volume = 1.0
# audio_ui_volume     = 1.0
# audio_music_volume  = 1.0
# audio_ambient_volume = 1.0
