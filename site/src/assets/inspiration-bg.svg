<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#3a7abd" stroke-width="1" stroke-opacity="0.15" fill="none">
    <rect x="50" y="50" width="700" height="500" rx="10"/>
    <rect x="100" y="100" width="600" height="400" rx="5"/>
  </g>
  <g transform="translate(400,300)" fill="none" stroke="#4a8ad4" stroke-width="1.5" stroke-opacity="0.2">
    <path d="M-200,0 Q-100,-80 0,0 Q100,80 200,0"/>
    <path d="M-200,0 Q-100,80 0,0 Q100,-80 200,0"/>
    <path d="M0,-200 Q-80,-100 0,0 Q80,100 0,200"/>
    <path d="M0,-200 Q80,-100 0,0 Q-80,100 0,200"/>
  </g>
  <!-- controller icon -->
  <g transform="translate(400,300)" fill="none" stroke="#4a8ad4" stroke-width="2" stroke-opacity="0.3">
    <rect x="-60" y="-30" width="120" height="60" rx="30"/>
    <line x1="-90" y1="-10" x2="-60" y2="-10"/>
    <line x1="-90" y1="10" x2="-60" y2="10"/>
    <line x1="60" y1="-10" x2="90" y2="-10"/>
    <line x1="60" y1="10" x2="90" y2="10"/>
    <circle cx="-15" cy="-8" r="4"/>
    <circle cx="15" cy="-8" r="4"/>
  </g>
</svg>
